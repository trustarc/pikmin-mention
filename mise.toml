[tools]
bun = "latest"
rust = "stable"

[tasks.start]
description = "Run the app in development"
alias = ["dev", "s"]
run = "bun run tauri dev"

[tasks.build]
description = "Bundle the app for this platform"
alias = "b"
run = "bun run tauri build"

[tasks.format]
description = "Format with prettier and rustfmt"
alias = "f"
run = ["bun run format", "cargo fmt --manifest-path src-tauri/Cargo.toml"]

[tasks.test]
description = "Run bun and cargo tests"
alias = "t"
run = ["bun test", "cargo test --manifest-path src-tauri/Cargo.toml"]

[tasks.check]
description = "Typecheck, format check, test and lint"
alias = "c"
run = [
  "bun run typecheck",
  "bun run format:check",
  "bun test",
  "cargo fmt --manifest-path src-tauri/Cargo.toml -- --check",
  "cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings",
]

[tasks.publish]
description = "Tag the manifest version and push, which triggers the release"
run = '''
version=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
tag="v$version"

test -z "$(git status --porcelain)" || { echo "working tree is dirty" >&2; exit 1; }
test "$(git rev-parse --abbrev-ref HEAD)" = "main" || { echo "not on main" >&2; exit 1; }

git tag "$tag"
git push origin "$tag"
echo "pushed $tag"
'''
