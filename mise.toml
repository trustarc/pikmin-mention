[tools]
bun = "latest"
rust = "stable"

[tasks.start]
alias = ["dev", "s"]
run = "bun run tauri dev"

[tasks.build]
alias = "b"
run = "bun run tauri build"

[tasks.check]
alias = "c"
run = [
  "bun run typecheck",
  "cargo fmt --manifest-path src-tauri/Cargo.toml -- --check",
  "cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings",
]
