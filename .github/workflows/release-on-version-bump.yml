name: Release on version bump

on:
  push:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: detect
        run: |
          MANIFEST=src-tauri/Cargo.toml
          read_version() { grep -m1 '^version = ' | sed -E 's/^version = "(.*)"/\1/'; }

          NEW_VER=$(read_version < "$MANIFEST")
          OLD_VER=$(git show HEAD^:"$MANIFEST" 2>/dev/null | read_version || echo "")

          if [ "$OLD_VER" = "$NEW_VER" ] || [ -z "$NEW_VER" ]; then
            echo "no version bump ($OLD_VER -> $NEW_VER)"
            exit 0
          fi

          if gh release view "v$NEW_VER" >/dev/null 2>&1; then
            echo "v$NEW_VER already released"
            exit 0
          fi

          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: detect
    if: needs.detect.outputs.version != ''
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifacts: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifacts: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libxcb1-dev

      - uses: jdx/mise-action@v2

      - run: rustup target add ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - run: bun run tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifacts }}

  release:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)

          if [ -n "$PREV_TAG" ]; then
            PREAMBLE="Changes since $PREV_TAG"
            RANGE="${PREV_TAG}..HEAD"
          else
            PREAMBLE="Initial release"
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          fi

          COMMITS=$(git log --format='- %s' "$RANGE" || true)
          NOTES=$(printf "%s\n\n%s\n\nUnsigned build. On first launch: right-click the app and choose Open, or run\n\`xattr -dr com.apple.quarantine \"/Applications/Pikmin Mention.app\"\`\n" "$PREAMBLE" "$COMMITS")

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            artifacts/*
