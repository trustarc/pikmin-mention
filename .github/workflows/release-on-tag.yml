name: Release on tag

on:
  push:
    tags:
      - 'pikmin-mention==*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/pikmin-mention==}"
          MANIFEST=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "(.*)"/\1/')

          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag version $TAG does not match src-tauri/Cargo.toml ($MANIFEST)" >&2
            exit 1
          fi

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: dmg
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            updater: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifacts: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            updater: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage
            artifacts: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            updater: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libxcb1-dev

      - uses: jdx/mise-action@v2

      - run: rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: bun install --frozen-lockfile

      - run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifacts }}
            ${{ matrix.updater }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build latest.json
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#pikmin-mention==}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"

          platform() {
            sig=$(find artifacts -name "$1" | head -1)
            [ -n "$sig" ] || return 1
            printf '"%s":{"signature":"%s","url":"%s/%s"}' \
              "$2" "$(cat "$sig")" "$base" "$(basename "${sig%.sig}")"
          }

          entries=""
          for spec in "*.app.tar.gz.sig|darwin-universal" "*-setup.exe.sig|windows-x86_64" "*.AppImage.sig|linux-x86_64"; do
            pattern="${spec%%|*}"
            key="${spec##*|}"
            if entry=$(platform "$pattern" "$key"); then
              entries="${entries:+$entries,}$entry"
            fi
          done

          printf '{"version":"%s","pub_date":"%s","platforms":{%s}}' \
            "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$entries" > artifacts/latest.json

          cat artifacts/latest.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
            exit 0
          fi

          find artifacts -type f -print0 \
            | xargs -0 gh release create "$TAG" --title "$TAG" --generate-notes
