name: Release

on:
  push:
    branches:
      - main
    paths:
      - src-tauri/Cargo.toml
  workflow_dispatch:

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the manifest version is released
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          TAG="pikmin-mention==$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.released == 'false'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: app,dmg
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            updater: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis
            artifacts: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            updater: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: appimage
            artifacts: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            updater: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libxcb1-dev

      - uses: jdx/mise-action@v2

      - run: rustup target add ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - run: bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifacts }}
            ${{ matrix.updater }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build latest.json
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          tag = os.environ["TAG"]
          version = tag.split("==", 1)[1]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"

          targets = {
              "*.app.tar.gz.sig": ["darwin-aarch64", "darwin-x86_64"],
              "*-setup.exe.sig": ["windows-x86_64"],
              "*.AppImage.sig": ["linux-x86_64"],
          }

          platforms = {}
          root = pathlib.Path("artifacts")

          for pattern, keys in targets.items():
              sig = next(iter(sorted(root.rglob(pattern))), None)
              if sig is None:
                  print(f"missing {pattern}")
                  continue

              asset = sig.name[: -len(".sig")].replace(" ", ".")
              entry = {
                  "signature": sig.read_text().strip(),
                  "url": f"{base}/{asset}",
              }
              for key in keys:
                  platforms[key] = entry

          if not platforms:
              raise SystemExit("no signed artifacts found")

          pathlib.Path("artifacts/latest.json").write_text(
              json.dumps(
                  {
                      "version": version,
                      "pub_date": __import__("datetime")
                      .datetime.now(__import__("datetime").timezone.utc)
                      .strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "platforms": platforms,
                  },
                  indent=2,
              )
          )
          print(json.dumps(platforms, indent=2)[:400])
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          find artifacts -type f -print0 \
            | xargs -0 gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
